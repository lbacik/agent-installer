version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Work lands on develop and reaches main through a pull request, so
    # dependency updates follow the same path instead of targeting main.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        # Majors stay out of the group and arrive as individual pull requests.
        # A group that bundles two compiler or runner majors gives one failing
        # check with no way to tell which upgrade caused it.
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
