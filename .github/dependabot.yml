version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Work lands on develop and reaches main through a pull request, so
    # dependency updates follow the same path instead of targeting main.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
